<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Places · Japan Diary</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body data-page="collection">
  <header class="site-header">
    <a class="brand" href="../index.html">Japan Diary <span>✶</span></a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="../index.html">Diary</a><a class="active" href="food.html">Food</a><a href="trips.html">Trips</a><a href="history.html">History</a><a href="tokyo.html">Tokyo</a><a href="kyoto.html">Kyoto</a><a href="osaka.html">Osaka</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="page-hero">
      <div><p class="kicker">Places to eat & drink</p><h1>Food places.</h1><p class="intro">Save cafés, restaurants, bakeries, bars and anything else you want to remember.</p></div>
      <aside class="vintage-note"><span class="note-label">Collection</span><strong>Matcha · coffee · dinner</strong><span class="note-small">add your own places</span></aside>
    </section>

    <section class="content-layout">
      <aside class="paper-card sidebar-card">
        <div class="section-heading compact"><div><p class="kicker">New place</p><h2>Add</h2></div></div>
        <form id="collectionForm" class="collection-form" data-storage-key="japan-food-places-v1">
          <label>Name<input id="itemTitle" type="text" placeholder="Place name" required></label>
          <label>Area / type<input id="itemMeta" type="text" placeholder="Shibuya · café"></label>
          <label>Notes<textarea id="itemText" placeholder="What to order, why you saved it…"></textarea></label>
          <button class="button" type="submit">Save place</button>
        </form>
      </aside>
      <section><div class="section-heading"><div><p class="kicker">Saved</p><h2>My places</h2></div></div><div id="collectionList" class="collection-grid"></div></section>
    </section>
  </main>
  <script src="../site.js"></script>
</body>
</html>
