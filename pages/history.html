<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History · Japan Diary</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body data-page="collection">
  <header class="site-header">
    <a class="brand" href="../index.html">Japan Diary <span>✶</span></a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="../index.html">Diary</a><a href="food.html">Food</a><a href="trips.html">Trips</a><a class="active" href="history.html">History</a><a href="tokyo.html">Tokyo</a><a href="kyoto.html">Kyoto</a><a href="osaka.html">Osaka</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="page-hero">
      <div><p class="kicker">Notes & context</p><h1>History of Japan.</h1><p class="intro">A place for periods, people, concepts and historical notes you want to understand before or during the trip.</p></div>
      <aside class="vintage-note"><span class="note-label">Notebook</span><strong>periods · people · context</strong><span class="note-small">your own study notes</span></aside>
    </section>

    <section class="content-layout">
      <aside class="paper-card sidebar-card">
        <div class="section-heading compact"><div><p class="kicker">New note</p><h2>Add</h2></div></div>
        <form id="collectionForm" class="collection-form" data-storage-key="japan-history-notes-v1">
          <label>Topic<input id="itemTitle" type="text" placeholder="Topic or person" required></label>
          <label>Period / date<input id="itemMeta" type="text" placeholder="Edo period · 1603–1868"></label>
          <label>Notes<textarea id="itemText" placeholder="Your summary or key facts…"></textarea></label>
          <button class="button" type="submit">Save note</button>
        </form>
      </aside>
      <section><div class="section-heading"><div><p class="kicker">Saved</p><h2>History notes</h2></div></div><div id="collectionList" class="history-list"></div></section>
    </section>
  </main>
  <script src="../site.js"></script>
</body>
</html>
