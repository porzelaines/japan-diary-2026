<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Osaka · Japan Diary</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body data-page="collection">
  <header class="site-header">
    <a class="brand" href="../index.html">Japan Diary <span>✶</span></a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="../index.html">Diary</a><a href="food.html">Food</a><a href="trips.html">Trips</a><a href="history.html">History</a><a href="tokyo.html">Tokyo</a><a href="kyoto.html">Kyoto</a><a class="active" href="osaka.html">Osaka</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="page-hero">
      <div><p class="kicker">City notebook</p><h1>Osaka.</h1><p class="intro">Save neighborhoods, food spots, bars, shops, sights and anything else you want on your Osaka list.</p></div>
      <aside class="vintage-note"><span class="note-label">City page</span><strong>places · ideas · notes</strong><span class="note-small">Osaka collection</span></aside>
    </section>

    <section class="content-layout">
      <aside class="paper-card sidebar-card">
        <div class="section-heading compact"><div><p class="kicker">New item</p><h2>Add</h2></div></div>
        <form id="collectionForm" class="collection-form" data-storage-key="japan-osaka-v1">
          <label>Place / idea<input id="itemTitle" type="text" placeholder="Name" required></label>
          <label>Area / category<input id="itemMeta" type="text" placeholder="Namba · bar"></label>
          <label>Notes<textarea id="itemText" placeholder="Why you saved it, opening hours, details…"></textarea></label>
          <button class="button" type="submit">Save item</button>
        </form>
      </aside>
      <section><div class="section-heading"><div><p class="kicker">Saved</p><h2>Osaka list</h2></div></div><div id="collectionList" class="collection-grid"></div></section>
    </section>
  </main>
  <script src="../site.js"></script>
</body>
</html>
