<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trips · Japan Diary</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body data-page="collection">
  <header class="site-header">
    <a class="brand" href="../index.html">Japan Diary <span>✶</span></a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="../index.html">Diary</a><a href="food.html">Food</a><a class="active" href="trips.html">Trips</a><a href="history.html">History</a><a href="tokyo.html">Tokyo</a><a href="kyoto.html">Kyoto</a><a href="osaka.html">Osaka</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="page-hero">
      <div><p class="kicker">Day trips & weekends</p><h1>Trips.</h1><p class="intro">Keep ideas for day trips, countryside escapes and places worth leaving the city for.</p></div>
      <aside class="vintage-note"><span class="note-label">Collection</span><strong>nearby · overnight · someday</strong><span class="note-small">build your own shortlist</span></aside>
    </section>

    <section class="content-layout">
      <aside class="paper-card sidebar-card">
        <div class="section-heading compact"><div><p class="kicker">New trip</p><h2>Add</h2></div></div>
        <form id="collectionForm" class="collection-form" data-storage-key="japan-trip-ideas-v1">
          <label>Destination<input id="itemTitle" type="text" placeholder="Trip name" required></label>
          <label>Travel time / area<input id="itemMeta" type="text" placeholder="1.5 h from Tokyo"></label>
          <label>Notes<textarea id="itemText" placeholder="Why go, what to see, best season…"></textarea></label>
          <button class="button" type="submit">Save trip</button>
        </form>
      </aside>
      <section><div class="section-heading"><div><p class="kicker">Saved</p><h2>Trip ideas</h2></div></div><div id="collectionList" class="collection-grid"></div></section>
    </section>
  </main>
  <script src="../site.js"></script>
</body>
</html>
